name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # macOS 26 SDK required: the panel backdrop uses NSGlassEffectView (macOS 26),
    # which must exist at compile time even though it's #available-gated at runtime.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Only the repo owner bumps the version (at release time). Fail a PR from
      # anyone else that touches MARKETING_VERSION so it's enforced, not just asked.
      - name: Guard MARKETING_VERSION
        if: github.event_name == 'pull_request' && github.event.pull_request.author_association != 'OWNER'
        run: |
          if git diff "${{ github.event.pull_request.base.sha }}" HEAD -- project.yml | grep -qE '^[+-].*MARKETING_VERSION'; then
            echo "::error::Don't change MARKETING_VERSION in project.yml — the maintainer bumps the version at release."
            exit 1
          fi
      # Lint, enforcing: the baseline is clean, so any violation (warning or
      # error) fails via --strict. Run locally with `swiftlint lint --strict`;
      # without full Xcode, SWIFTLINT_DISABLE_SOURCEKIT=1 skips the
      # SourceKit-backed rules, so CI stays the authoritative check.
      #
      # The macos-26 image ships no swiftlint, so install it explicitly (a
      # missing binary used to be swallowed as a silent no-op).
      - name: Install SwiftLint and xcodegen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install swiftlint xcodegen
      - name: Lint (SwiftLint)
        run: swiftlint lint --strict --reporter github-actions-logging
      # Unit tests. Run locally with `make test` (needs full Xcode; the app
      # itself builds with just the Command Line Tools). CI is the enforced
      # gate: the suite was once never executed anywhere, which is how the
      # "-- Hz" bug and the untested doc-comment contract in DisplayMode
      # survived to a release.
      - name: Test
        run: make test
      # Every localization key the code uses must exist in the String Catalog.
      # SwiftUI coalesces interpolated text into "%@"-style lookup keys, and a
      # key missing from the catalog silently falls back to English at runtime
      # (issue class fixed in PR #34). Export what the compiler extracts and
      # diff it against the catalog. Pre-existing gaps are tracked in the
      # allowlist next to the script; remove entries as they get fixed.
      - name: Check localization keys
        run: |
          xcodebuild -quiet -exportLocalizations -project Crisp.xcodeproj \
            -localizationPath build/loc CODE_SIGNING_ALLOWED=NO \
            SWIFT_EMIT_LOC_STRINGS=YES SWIFT_VERSION=5 SWIFT_STRICT_CONCURRENCY=minimal
          python3 scripts/check-localization-keys.py build/loc/en.xcloc \
            Crisp/Resources/Localizable.xcstrings scripts/i18n-missing-allowlist.txt
      # Advisory here: completeness is enforced in the release path
      # (release.sh --publish) so a PR adding an English string never blocks a
      # contributor. This run only surfaces the current gaps on the PR.
      - name: Translation completeness (advisory)
        run: python3 scripts/check-translations.py Crisp/Resources/Localizable.xcstrings || true
      # Reuses the release script's dry run: compiles the universal binary,
      # builds the icon, compiles the String Catalog, and packages the DMG,
      # so a green check means the real release path builds. Publishes nothing.
      - name: Build (release dry run)
        run: ./scripts/release.sh v0.0.0-ci
